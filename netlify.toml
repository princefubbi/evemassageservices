[build]
  publish = "."
  command = "npm install"

# ── ADMIN ──
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# ── BLOG ──
# This must come FIRST — protects all-posts from being caught by the slug rule below
[[redirects]]
  from = "/blog/all-posts/"
  to = "/blog/all-posts/index.html"
  status = 200

# This must come SECOND — catches all other /blog/slug/ URLs and serves the post template
[[redirects]]
  from = "/blog/:slug/"
  to = "/blog/all-posts/index.html?post=:slug"
  status = 200

# ── HEADERS ──
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
